name: Update Garmin Running Data

on:
  # Schedule paused: the saved Garmin token (GARMIN_TOKEN_B64) expired and every
  # run since 2026-07-28 fails with API Error 401. Refresh the secret, then
  # uncomment the schedule.
  # schedule:
  #   - cron: "0 12 * * *" # 12:00 UTC daily
  workflow_dispatch:

jobs:
  update-garmin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Garmin activities and records
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
        run: python bin/update_garmin_activities.py

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _data/garmin_activities.yml
          git diff --staged --quiet || (git commit -m "Update Garmin running data" && git push)
