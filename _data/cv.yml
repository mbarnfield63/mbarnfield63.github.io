        location: Teddington, UK
        start_date: 2017
        end_date: 2019
        highlights:
          - "NiCE-MSi: optimised MALDI-MSi matrix preparation, and used DESI-MSi, the HTX TM-Sprayer and MATLAB. Helped the lab manager with daily operations and inventory."
          - "Nuclear Metrology: alpha and gamma spectroscopy, ICP-MS, and separation of ⁹³Zr and ⁹³Nb with anion exchange resin. Sorted and organised the safe storage and removal of nuclear waste."

