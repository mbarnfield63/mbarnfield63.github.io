  sections:
    Summary:
      - Third-year PhD researcher in the ExoMol group at University College London. I build machine learning tools for large molecular spectroscopy databases, used to model the atmospheres of exoplanets. I published two first-author papers in 2026, in the Journal of Molecular Spectroscopy and in JQSRT.

    Experience:
      - company: University College London, Department of Physics and Astronomy
        position: Doctoral Researcher, Machine Learning and Astrophysical Spectroscopy
        location: London, UK
        start_date: 2024
        end_date: present
        summary: "Supervisors: Prof. Jonathan Tennyson FRS and Prof. Sergei N. Yurchenko"
        highlights:
          - "Published a first-author paper on neural network corrections to the energy levels of rare isotopic molecules (Journal of Molecular Spectroscopy, 2026)."
          - "Built a graph neural network pipeline that assigned quantum numbers to 224,650 unlabelled CO₂ states across 12 isotopologues (first author, JQSRT, 2026)."
          - "Built an LLM-assisted pipeline (OCR, then markdown, then structured extraction) that turns published spectroscopy papers into machine-readable datasets, plus an agent that searches the literature for relevant papers."
          - "Built a PostgreSQL database and read-only REST API for MARVEL energy level data: 31 runs from 19 publications, covering 29 isotopologues."
          - "Lead graph neural network work on spectroscopic network solving (MARVEL_GNN) and on isotopologue energy level extrapolation."
          - "Rebuilt the spectroscopic network solving engine (MARVEL v5) with a Python backend and a React, TypeScript and D3.js frontend, using test-driven development."
          - "Maintain a 365-entry knowledge base of the ExoMol literature (ExoMol Wiki), with automated validation checks."

      - company: Fluorochem Ltd.
        position: Consultant and Scientific Content Writer
        location: Remote
        start_date: 2024
        end_date: 2025
        highlights:
          - "Gave consultancy on chemical synthesis and organometallics to support new product development and new website content."

      - company: University of Bristol
        position: Royal Society of Chemistry Summer Research Student
        location: Bristol, UK
        start_date: 2023-06
        end_date: 2023-09
        summary: "Project: Machine Learning Emulator for Atmospheric Trace Gas Transport. Supervisor: Prof. Matt Rigby"
        highlights:
          - "Scaled a proof-of-concept ML emulator for greenhouse gas transport from its original domain to the whole UK and all regional methane measurement sites."
          - "Measured and improved the computational efficiency of the larger model on the BluePebble4 HPC cluster."
          - "Processed and plotted large spatial flux and emissions datasets with Python's xarray."

      - company: UCL Geography
        position: London NERC DTP Summer Intern
        location: London, UK
        start_date: 2022-06
        end_date: 2022-09
        summary: "Project: Influence of mega constellations on our atmosphere. Supervisor: Dr Eloise Marais"
        highlights:
          - "Studied the NOₓ and Al₂O₃ emissions from launching and maintaining satellite mega constellations."
          - "Gathered and analysed 3 large datasets from several sources in Python."
          - "Presented the work at the Natural History Museum, on the environmental impact of the new space race."

      - company: National Physical Laboratory
